# ⚠️ NO CAMBIES ESTE NOMBRE sin cambiarlo también en Cloudflare.
#
# Este nombre decide dos cosas a la vez: a qué Worker se despliega y cuál es la URL pública
# (https://<name>.<subdominio>.workers.dev). Y hay un segundo sitio donde el nombre existe: la
# integración de Git del dashboard de Cloudflare, que al conectar el repo propone por defecto el
# nombre del repositorio normalizado — "Asistente-Carmen" se convierte en "asistentecarmen".
#
# Si los dos no coinciden, el build no falla de forma obvia: wrangler ignora el nombre del
# dashboard y despliega al de aquí, así que acabas con dos Workers y sacando la URL del que está
# vacío. Peor todavía, los secretos y los bindings de KV son POR Worker: los pones en uno,
# despliegas al otro, y revienta en runtime pareciendo un problema de código.
#
# Ese desajuste ya pasó una vez (esto se llamaba "companion-worker"). El nombre de aquí se cambió
# para que coincida con lo que creó la integración de Git.
name = "asistentecarmen"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# ⚠️ NO QUITES ESTO.
#
# Por defecto, cada `wrangler deploy` BORRA todas las variables del Worker y deja solo las que
# aparecen en el bloque [vars] de este archivo. Como aquí desplegamos con la integración de Git de
# Cloudflare, eso pasa en cada push — y lo que se añadió a mano en el dashboard desaparece sin
# avisar.
#
# Eso es exactamente lo que pasó con GITHUB_TOKEN: se guardó bien en el dashboard, se ve en la
# lista, y el Worker lo leía vacío porque el siguiente despliegue se lo llevó por delante.
#
# `keep_vars = true` le dice a wrangler que no toque lo que ya está configurado y solo añada lo de
# [vars]. Es la opción recomendada por Cloudflare justo para este caso: cuando parte de la
# configuración se mete por el dashboard.
# https://developers.cloudflare.com/workers/wrangler/configuration/
keep_vars = true

# --- KV: suscripciones push + estado simple ---
[[kv_namespaces]]
binding = "KV"
id = "84bc612d19634b5683c9ada11835394c" # namespace "Asistente_Carmen"

# D1 (log de cambios de KB) no está en uso todavía en el código v1 — se agrega aquí solo si
# más adelante se implementa esa función. Por ahora se omite para no bloquear el deploy con
# un database_id inválido.

# --- Cron Triggers ---
# El plan gratis de Cloudflare Workers permite máximo 5 cron triggers por cuenta — por eso
# KB1-4 (semestral, 1-ago y 1-ene) va en UNA sola expresión usando "1,8" en el campo de mes,
# en vez de dos triggers separados.
# KB5-6 (movilidad, trámites): mensual
# Recordatorios de subir horario (KB8): 25-ago y 20-dic. NOTA: el de 25-ago ya no aplica para
# el año 2026-2027 — el horario del 1er semestre se investigó y cargó directo a KB8-horario.md
# antes de la entrega (no hizo falta que ella lo subiera). El de 20-dic sigue vigente: el 2o
# semestre (inicia enero 2027) todavía no está documentado.
# Los dos recordatorios de horario (25-ago y 20-dic) van FUSIONADOS en una sola expresión
# "0 8 20,25 8,12 *" para dejar libre un slot de los 5. Eso los dispara 4 veces al año en vez de
# 2 (20-ago, 25-ago, 20-dic, 25-dic), lo cual es inofensivo: recordatorioSubirHorario consulta
# antes debeRecordarHorario() y no manda nada si el horario ya está al día.
# Trámites de los primeros 30 días: 06:00 UTC = 08:00 en Pamplona en verano, 07:00 en invierno.
# Tiene que ser temprano porque el aviso del mismo día no sirve de nada si llega después de la
# cita — el check-in diario se queda a las 09:00 UTC, que es media mañana allí.
# Check-in proactivo diario: cada mañana
[triggers]
crons = [
  "0 6 1 1,8 *",     # KB1-4 auto-investigación (1-ene y 1-ago, misma expresión)
  "0 6 1 * *",       # KB5-6 auto-investigación (mensual)
  "0 8 20,25 8,12 *",# recordatorio: sube tu horario (ago y dic) — ver nota sobre la fusión
  "0 6 * * *",       # recordatorios de los trámites de los primeros 30 días (08:00 en Pamplona)
  "0 9 * * *"        # check-in proactivo diario (ánimo, pendientes)
]

# --- Variables de entorno / secretos ---
# Configura los secretos reales con:
#   wrangler secret put ANTHROPIC_API_KEY   ✅ ya configurada
#   wrangler secret put ELEVENLABS_API_KEY  ✅ ya configurada
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put VAPID_PUBLIC_KEY
#   wrangler secret put VAPID_PRIVATE_KEY
# También se pueden meter desde el dashboard: Workers → asistentecarmen → Settings →
# Variables and Secrets → Add, con Type = Secret. Los secretos NO se pisan al desplegar; las
# variables de [vars] de aquí abajo SÍ pisan lo que haya en el dashboard, así que esas se
# cambian aquí y no allá.
# Ver /README.md para la lista completa y de dónde sacar cada una.
[vars]
# El agent_id no es secreto — va también en el bundle del frontend, a la vista de cualquiera. Vive
# aquí para que el Worker pueda leer la base de conocimiento del agente (ver routes/kbSync.ts).
ELEVENLABS_AGENT_ID = "agent_8701kyeepa7tffmr5475esyq7rtq"
# Espejo del KB en el repo: cada actualización de un documento se escribe también como commit del
# .md correspondiente. Eso da historial y, sobre todo, deshacer — ElevenLabs no guarda versiones.
# El token va aparte como secret (GITHUB_TOKEN); estos dos no son secretos.
GITHUB_REPO = "EricToled564/Asistente-Carmen"
GITHUB_BRANCH = "claude/app-creation-documents-c74xfz"
# La mitad pública del par VAPID de Web Push. Es pública por diseño: va también en el bundle del
# frontend, porque el navegador la necesita para suscribirse. Solo la privada es secreto, y esa va
# aparte como secret. Ponerla aquí ahorra tener que meter dos cosas a mano en el dashboard.
VAPID_PUBLIC_KEY = "BDatHvEq4nUq5kixqdh-okt6zzeC8rpM8Vp7qng-TOB87Ld4-wuwuXdOpVrd_7JxV-tNsN7bulLbDM2WoQxLFXI"
# A dónde llega la alerta cuando Carmen aprieta el SOS. Acepta varias direcciones separadas por
# coma, y conviene que sean varias: si la única persona de la lista está durmiendo o sin batería,
# el aviso no llega a nadie.
#
# Va aquí y no en el dashboard: las variables de [vars] pisan las del dashboard en cada
# despliegue, así que puesta allá se perdería sola en el siguiente push — y nadie se enteraría
# hasta el día que hiciera falta.
#
# ⚠️ Ahora mismo SOLO puede ir erictoled564@gmail.com, y no es una decisión de diseño: Resend
# rechaza cualquier otro destinatario mientras no haya un dominio verificado. Comprobado, no
# supuesto — al intentar enviar a gtoledano89@gmail.com respondió 403: "You can only send testing
# emails to your own email address (erictoled564@gmail.com)".
#
# Para que le llegue también al hermano de Eric o a quien sea: verificar un dominio propio en
# resend.com/domains (finalupgrade.ai sirve), y cambiar el `from` de routes/sos.ts de
# onboarding@resend.dev a sos@ese-dominio. A partir de ahí esta lista acepta los que hagan falta.
FAMILIA_EMAIL_DESTINO = "erictoled564@gmail.com"
RESIDENCIA_DIRECCION = "CampusHome — Av. de Pío XII, 28, 31008 Iturrama, Pamplona, Navarra"
# Los document_id del KB (KB1, KB3, KB8, KB9-x...) no van aquí: viven en un registro en KV, que
# escala a los 60 documentos. Y ya no se cargan a mano uno por uno — el Worker se los registra
# solo leyendo la KB del agente:
#   curl -X POST https://asistentecarmen.erictoled564.workers.dev/kb-registrar-ids
# Ver worker/src/routes/kbSync.ts y worker/src/lib/kbRegistry.ts.

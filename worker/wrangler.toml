name = "companion-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# --- KV: suscripciones push + estado simple ---
[[kv_namespaces]]
binding = "KV"
id = "84bc612d19634b5683c9ada11835394c" # namespace "Asistente_Carmen"

# D1 (log de cambios de KB) no está en uso todavía en el código v1 — se agrega aquí solo si
# más adelante se implementa esa función. Por ahora se omite para no bloquear el deploy con
# un database_id inválido.

# --- Cron Triggers ---
# El plan gratis de Cloudflare Workers permite máximo 5 cron triggers por cuenta — por eso
# KB1-4 (semestral, 1-ago y 1-ene) va en UNA sola expresión usando "1,8" en el campo de mes,
# en vez de dos triggers separados.
# KB5-6 (movilidad, trámites): mensual
# Recordatorios de subir horario (KB8): 25-ago y 20-dic. NOTA: el de 25-ago ya no aplica para
# el año 2026-2027 — el horario del 1er semestre se investigó y cargó directo a KB8-horario.md
# antes de la entrega (no hizo falta que ella lo subiera). El de 20-dic sigue vigente: el 2o
# semestre (inicia enero 2027) todavía no está documentado.
# Check-in proactivo diario: cada mañana
[triggers]
crons = [
  "0 6 1 1,8 *", # KB1-4 auto-investigación (1-ene y 1-ago, misma expresión)
  "0 6 1 * *",   # KB5-6 auto-investigación (mensual)
  "0 8 25 8 *",  # recordatorio: sube tu horario (ver nota — moot para 2026, útil en años futuros)
  "0 8 20 12 *", # recordatorio: sube tu horario del 2o semestre (sí aplica, vigente)
  "0 9 * * *"    # check-in proactivo diario (radar académico, ánimo, etc.)
]

# --- Variables de entorno / secretos ---
# Configura los secretos reales con:
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put ELEVENLABS_API_KEY
#   wrangler secret put ELEVENLABS_AGENT_ID
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put VAPID_PUBLIC_KEY
#   wrangler secret put VAPID_PRIVATE_KEY
# Ver /README.md para la lista completa y de dónde sacar cada una.
[vars]
FAMILIA_EMAIL_DESTINO = "REEMPLAZA_CON_EMAIL_DE_LA_FAMILIA"
RESIDENCIA_DIRECCION = "REEMPLAZA_CON_DIRECCION_REAL"
# Los document_id del KB (KB1, KB3, KB8, KB9-x, etc) YA NO van aquí como env vars — viven en un
# registro en KV que escala a los 27+ documentos. Cárgalos así, uno por uno, después de subir
# cada documento a mano en ElevenLabs:
#   npx wrangler kv key put --binding=KV "kb-doc-id:KB1" "<document_id>"
# Ver kb/README.md y worker/src/lib/kbRegistry.ts para el detalle completo.
